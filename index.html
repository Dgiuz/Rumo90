<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EEF1F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1114" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Rumo aos 90">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
<title>Rumo aos 90</title>
<meta name="claude:viewport-fit-sides" content="cover">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;0,800;1,800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-width column (max 560px) with a fixed bottom tab bar; the workout opens as a full-screen layer. Plate colors identify the four workouts: A red, B blue, C yellow, D green. */
:root{
  --bg:#EEF1F4; --card:#FFFFFF; --sunk:#E4E8ED; --ink:#14181D; --muted:#59636F; --faint:#7C8691; --line:#D6DBE1;
  --surface:#E4E8ED; --fig:#14181D; --fig-far:#9AA4AF; --ground:#B3BBC4; --scene:#C3CAD2; --iron:#2B3137;
  --pA:#D3263A; --pB:#1F5AD4; --pC:#E2A700; --pD:#16904E;
  --onA:#FFFFFF; --onB:#FFFFFF; --onC:#14181D; --onD:#FFFFFF;
  --hot:#D3263A; --good:#138446; --goodbg:#DDF1E5; --scrim:rgba(10,12,15,.5);
  --tone:var(--ink); --on:var(--bg);
  --display:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --body:"Barlow",-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1114; --card:#181D23; --sunk:#232A33; --ink:#E8EBEF; --muted:#A3ACB6; --faint:#7D8792; --line:#2C343D;
  --surface:#232A33; --fig:#E8EBEF; --fig-far:#5E6874; --ground:#3A434D; --scene:#3A434C; --iron:#C4CBD2;
  --pA:#FF5567; --pB:#5E8EFF; --pC:#F2C232; --pD:#35C77C;
  --onA:#14181D; --onB:#0E1114; --onC:#14181D; --onD:#0E1114;
  --hot:#FF5567; --good:#35C77C; --goodbg:#17352A; --scrim:rgba(0,0,0,.62); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1114; --card:#181D23; --sunk:#232A33; --ink:#E8EBEF; --muted:#A3ACB6; --faint:#7D8792; --line:#2C343D;
  --surface:#232A33; --fig:#E8EBEF; --fig-far:#5E6874; --ground:#3A434D; --scene:#3A434C; --iron:#C4CBD2;
  --pA:#FF5567; --pB:#5E8EFF; --pC:#F2C232; --pD:#35C77C;
  --onA:#14181D; --onB:#0E1114; --onC:#14181D; --onD:#0E1114;
  --hot:#FF5567; --good:#35C77C; --goodbg:#17352A; --scrim:rgba(0,0,0,.62); color-scheme:dark}
[data-tone="A"]{--tone:var(--pA);--on:var(--onA)}
[data-tone="B"]{--tone:var(--pB);--on:var(--onB)}
[data-tone="C"]{--tone:var(--pC);--on:var(--onC)}
[data-tone="D"]{--tone:var(--pD);--on:var(--onD)}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,p{margin:0}
h1,h2,h3{font-family:var(--display);font-weight:800;line-height:1;text-wrap:balance}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--pB);outline-offset:2px}
.num,.tnum{font-variant-numeric:tabular-nums}

.app{max-width:560px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
.view{display:grid;gap:14px;padding-top:18px}
.top{display:grid;gap:2px;padding-block:4px 2px}
.eyebrow{font-size:12.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.h1{font-size:44px;font-style:italic;text-transform:uppercase;letter-spacing:-.005em}
.card{background:var(--card);border-radius:20px;padding:18px;display:grid;gap:12px;min-width:0}
.card h2{font-size:28px;text-transform:uppercase}
.card .sub{color:var(--muted);font-size:15px}
.sec-title{font-family:var(--display);font-weight:800;font-size:22px;text-transform:uppercase;padding-top:8px}
.muted{color:var(--muted)}
.small{font-size:14px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 20px;border-radius:14px;border:0;background:var(--sunk);color:var(--ink);font-weight:700;font-size:16.5px;text-decoration:none;white-space:nowrap}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.tone{background:var(--tone);color:var(--on)}
.btn.block{width:100%}
.btn.sm{min-height:40px;padding:0 14px;font-size:15px;border-radius:12px}
.btn.on{background:var(--good);color:#FFFFFF}
.btn:active{transform:scale(.985)}
.btn .ico svg{width:20px;height:20px}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.link{background:none;border:0;padding:4px 0;font-weight:600;font-size:15px;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.link.danger{color:var(--hot)}
.ico{display:inline-grid;place-items:center}
.ico svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.iconbtn{width:44px;height:44px;border-radius:12px;border:0;background:var(--sunk);display:grid;place-items:center;flex:none}
.chip{border:0;border-radius:999px;padding:7px 14px;font-weight:700;font-size:14px;background:var(--ink);color:var(--bg);white-space:nowrap}

/* discs */
.disc{--s:30px;width:var(--s);height:var(--s);flex:none;border-radius:50%;display:grid;place-items:center;background:var(--tone);color:var(--on);font-family:var(--display);font-weight:800;font-size:calc(var(--s) * .56);line-height:1}
.disc.lg{--s:56px}
.disc.k-walk,.disc.k-rest{background:transparent;color:var(--faint);box-shadow:inset 0 0 0 2px var(--line);font-family:var(--body);font-size:10px;font-weight:700}
.disc.k-rest{box-shadow:none;border:2px dashed var(--line)}
.disc.k-test,.disc.k-measure{background:var(--ink);color:var(--bg)}

/* today card */
.today{gap:14px}
.today-head{display:flex;align-items:center;gap:14px}
.today-head h2{font-size:32px}
.today-head .sub{margin-top:4px}
.plan-list{list-style:none;margin:0;padding:0;display:grid;gap:0;border-top:1px solid var(--line)}
.plan-list li{display:grid;grid-template-columns:92px minmax(0,1fr);gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}
.plan-list li span{font-size:12.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding-top:2px}
.done-banner{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--goodbg);font-weight:600}
.done-banner .ico{color:var(--good)}

/* week strip */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wday{display:grid;justify-items:center;gap:6px;padding:8px 0 9px;border-radius:14px;border:0;background:transparent;min-width:0;position:relative}
.wday small{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase}
.wday.today{background:var(--sunk)}
.wday.today small{color:var(--ink)}
.wday .ok{position:absolute;top:30px;right:calc(50% - 21px);width:17px;height:17px;border-radius:50%;background:var(--good);color:#FFFFFF;display:grid;place-items:center;box-shadow:0 0 0 2px var(--card)}
.wday .ok svg{width:12px;height:12px;stroke-width:3}

/* stat tiles */
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{background:var(--card);border:0;border-radius:18px;padding:14px 16px;text-align:left;display:grid;gap:2px;min-width:0}
.stat small{font-size:13px;font-weight:600;color:var(--muted)}
.stat b{font-family:var(--display);font-weight:800;font-size:32px;line-height:1.05;font-variant-numeric:tabular-nums}
.stat span{font-size:13.5px;color:var(--muted)}
.nudge{display:flex;align-items:center;gap:12px;justify-content:space-between}
.nudge p{font-size:15px}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabbar-in{max-width:560px;margin-inline:auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.tabbar a{display:grid;justify-items:center;gap:2px;padding:9px 0 8px;text-decoration:none;color:var(--faint);font-size:12px;font-weight:600}
.tabbar a[aria-current="page"]{color:var(--ink)}
.tabbar a[aria-current="page"] .ico svg{stroke-width:2.3}

/* plan */
.cal{display:grid;gap:12px}
.cal-week{display:grid;gap:6px}
.cal-week p{font-size:12.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.cal-week p b{color:var(--ink)}
.cal-row{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cday{position:relative;display:grid;justify-items:center;gap:4px;padding:7px 0;border-radius:12px;border:0;background:transparent;min-width:0}
.cday small{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.cday.today{background:var(--sunk)}
.cday.today small{color:var(--ink);font-weight:700}
.cday .ok{position:absolute;top:4px;right:calc(50% - 20px);width:15px;height:15px;border-radius:50%;background:var(--good);color:#FFFFFF;display:grid;place-items:center;box-shadow:0 0 0 2px var(--card)}
.cday .ok svg{width:10px;height:10px;stroke-width:3.2}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .disc{--s:18px}
details.rules{background:var(--card);border-radius:20px;padding:4px 18px}
details.rules summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;padding:14px 0;font-family:var(--display);font-weight:800;font-size:22px;text-transform:uppercase}
details.rules summary::-webkit-details-marker{display:none}
details.rules[open] summary .ico{transform:rotate(180deg)}
.rule{padding:12px 0;border-top:1px solid var(--line);display:grid;gap:4px}
.rule h3{font-size:19px;text-transform:uppercase}
.rule p{font-size:15px;color:var(--muted)}
.rule p b{color:var(--ink)}

/* evolution */
.big{font-family:var(--display);font-weight:800;font-size:56px;line-height:.95;font-variant-numeric:tabular-nums}
.big small{font-size:24px;margin-left:4px}
.goal{display:grid;gap:6px}
.goal-track{position:relative;height:10px;border-radius:999px;background:var(--sunk)}
.goal-track i{position:absolute;inset:0 auto 0 0;border-radius:999px;background:var(--ink);min-width:10px}
.goal-ends{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));background:var(--sunk);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:10px;padding:8px 0;font-weight:700;font-size:15px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .gt{fill:var(--muted);font:500 11px var(--body);font-variant-numeric:tabular-nums}
.chart .goal-l{stroke:var(--hot);stroke-width:1.5;stroke-dasharray:4 4}
.chart .goal-t{fill:var(--hot);font:700 11px var(--body)}
.chart .ln{fill:none;stroke:var(--ink);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .ar{fill:var(--ink);opacity:.07}
.chart .pt{fill:var(--card);stroke:var(--ink);stroke-width:2}
.chart .pt.end{fill:var(--ink)}
.chart .vt{fill:var(--ink);font:700 13px var(--body);font-variant-numeric:tabular-nums}
.empty{padding:22px 4px;text-align:center;color:var(--muted);font-size:15px}
.list{list-style:none;margin:0;padding:0;display:grid}
.list li{border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.li{display:flex;align-items:center;gap:12px;padding:11px 0;width:100%;background:none;border:0;text-align:left;min-width:0}
.li .grow{flex:1;min-width:0;display:grid;gap:1px}
.li .grow b{font-weight:700;font-size:15.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .grow span{font-size:13.5px;color:var(--muted)}
.li .val{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.li .val small{display:block;font-weight:500;font-size:12.5px;color:var(--muted)}
.li .del{width:36px;height:36px;border-radius:10px;border:0;background:var(--sunk);display:grid;place-items:center;flex:none}
.li .del svg{width:16px;height:16px}

/* settings */
.field{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.field:first-of-type{border-top:0}
.field label{font-weight:600}
.field small{display:block;font-weight:400;font-size:13.5px;color:var(--muted)}
.inp{height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);padding:0 12px;font-size:16px;color:var(--ink);min-width:0}
.inp.w{width:150px}
.inp.n{width:92px;text-align:center;font-variant-numeric:tabular-nums}
.switch{width:52px;height:32px;border-radius:999px;border:0;background:var(--line);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#FFFFFF;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.switch[aria-checked="true"]{background:var(--good)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
.steps-n{margin:0;padding-left:22px;display:grid;gap:6px;font-size:15px}
.ver{font-size:12.5px;color:var(--faint);text-align:center;padding-block:6px 4px}

/* workout layer */
.wo{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.wo-bar{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--line);padding-top:calc(8px + env(safe-area-inset-top,0px));padding-bottom:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wo-bar-in{max-width:560px;margin-inline:auto;display:flex;align-items:center;gap:12px}
.wo-title{flex:1;min-width:0;display:grid;line-height:1.2}
.wo-title b{font-family:var(--display);font-weight:800;font-size:22px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wo-title span{font-size:13.5px;color:var(--muted)}
.wo-clock{font-weight:700;font-variant-numeric:tabular-nums;font-size:17px;padding:8px 12px;border-radius:12px;background:var(--sunk)}
.wo-body{max-width:560px;margin-inline:auto;display:grid;gap:14px;padding-top:14px;padding-bottom:calc(150px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wo-tip{font-size:15px;color:var(--muted);background:var(--card);border-radius:16px;padding:12px 14px}
.wo-tip b{color:var(--ink)}
.group-h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;padding:8px 2px 0}
.group-h b{font-family:var(--display);font-weight:800;font-size:20px;text-transform:uppercase}
.group-h span{font-size:14px;color:var(--muted)}
.pair{display:grid;gap:8px}
.lift{background:var(--card);border-radius:20px;padding:14px;display:grid;gap:12px;min-width:0}
.lift.complete{box-shadow:inset 0 0 0 2px var(--good)}
.lift-head{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;align-items:center}
.thumb{width:64px;height:64px;border-radius:14px;border:0;padding:0;background:var(--surface);overflow:hidden;display:block}
.thumb svg{display:block;width:100%;height:100%}
.lh{display:grid;gap:3px;min-width:0}
.lh-top{display:flex;align-items:center;gap:8px}
.tag{font-size:12px;font-weight:700;border-radius:6px;padding:1px 7px;background:var(--tone);color:var(--on)}
.howto{border:0;background:none;padding:0;font-size:13.5px;font-weight:600;color:var(--muted);text-decoration:underline;text-underline-offset:2px}
.lh h3{font-size:22px;text-transform:uppercase;line-height:1.02}
.lh p{font-size:14px;color:var(--muted)}
.sug{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:12px;background:var(--goodbg);font-size:14px}
.sets{display:grid;gap:6px}
.srow{display:grid;grid-template-columns:38px minmax(0,1fr) 70px 62px 48px;gap:8px;align-items:center}
.srow.hd span{font-size:11px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--faint);text-align:center}
.srow.hd span:nth-child(2){text-align:left}
.sn{font-weight:700;text-align:center;color:var(--muted);font-variant-numeric:tabular-nums}
.prev{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell{height:44px;width:100%;min-width:0;border-radius:11px;border:1.5px solid var(--line);background:var(--bg);text-align:center;font-weight:700;font-size:17px;font-variant-numeric:tabular-nums;color:var(--ink);padding:0 4px}
.cell::placeholder{color:var(--faint);font-weight:500}
.cell:focus{border-color:var(--ink);outline:none}
.chk{height:44px;width:48px;border-radius:11px;border:1.5px solid var(--line);background:var(--card);display:grid;place-items:center;color:var(--faint)}
.chk svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.srow.done .chk{background:var(--good);border-color:var(--good);color:#FFFFFF}
.srow.done .cell{background:var(--goodbg);border-color:transparent}
.stations{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.st{display:flex;align-items:center;gap:10px;width:100%;padding:4px;border:0;border-radius:12px;background:none;text-align:left}
.st .thumb{width:44px;height:44px;border-radius:10px}
.st b{font-variant-numeric:tabular-nums;width:18px;text-align:center;color:var(--muted)}
.st span{font-weight:600}
details.warm summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px}
details.warm summary::-webkit-details-marker{display:none}
details.warm[open] summary .ico{transform:rotate(180deg)}
.warm-list{list-style:none;margin:0;padding:0;display:grid;gap:0;margin-top:6px}
.warm-list li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:15px}
.warm-list button{border:0;background:none;padding:0;text-align:left;font-weight:600;text-decoration:underline;text-underline-offset:2px}
.warm-list b{white-space:nowrap;font-variant-numeric:tabular-nums}
.finish{display:grid;gap:10px;justify-items:center;padding-top:6px}

/* rest bar */
.restbar{position:fixed;left:0;right:0;bottom:0;z-index:45;background:var(--ink);color:var(--bg);padding-top:10px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.restbar.go{background:var(--good);color:#FFFFFF}
.rest-in{max-width:560px;margin-inline:auto;display:grid;gap:8px}
.rest-top{display:flex;align-items:center;gap:12px}
.rest-txt{flex:1;min-width:0;display:grid;line-height:1.2}
.rest-txt small{font-size:13px;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rest-txt b{font-size:15px}
.rest-time{font-family:var(--display);font-weight:800;font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.rest-track{height:4px;border-radius:999px;background:rgba(127,127,127,.35);overflow:hidden}
.rest-track i{display:block;height:100%;background:currentColor;width:0}
.rest-btns{display:flex;gap:6px}
.rest-btns button{border:0;border-radius:10px;padding:8px 10px;font-weight:700;font-size:14px;background:rgba(127,127,127,.25);color:inherit}

/* sheet */
.sheet{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:var(--scrim)}
.panel{position:relative;width:100%;max-width:560px;max-height:calc(100% - env(safe-area-inset-top,0px) - 24px);overflow:auto;overscroll-behavior:contain;background:var(--card);border-radius:24px 24px 0 0;padding-top:18px;padding-bottom:calc(22px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:grid;gap:14px;align-content:start;animation:rise .26s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{transform:translateY(26px);opacity:0}to{transform:none;opacity:1}}
.panel .x{position:absolute;top:12px;right:max(12px,env(safe-area-inset-right,0px));width:40px;height:40px;border-radius:50%;border:0;background:var(--sunk);display:grid;place-items:center}
.panel .x svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
.panel h2{font-size:32px;text-transform:uppercase;padding-right:48px}
.panel h4{font-family:var(--display);font-weight:800;font-size:19px;text-transform:uppercase;margin-top:4px}
.sh-fig{width:100%;max-width:300px;aspect-ratio:1;justify-self:center;border-radius:18px;background:var(--surface);overflow:hidden}
.sh-fig svg{display:block;width:100%;height:100%}
.sh-ctl{display:flex;justify-content:center;gap:8px}
.pill{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:600}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--sunk)}
.steps{margin:0;padding-left:22px;display:grid;gap:7px;font-size:15.5px}
.steps li::marker{font-weight:700;color:var(--muted)}
.errs{margin:0;padding:0;list-style:none;display:grid;gap:6px;font-size:15.5px}
.errs li{display:flex;gap:8px}
.errs li::before{content:"✕";font-weight:700;color:var(--hot)}
.tip{font-size:15px;background:var(--sunk);border-radius:12px;padding:10px 12px}
.form{display:grid;gap:12px}
.form label{display:grid;gap:6px;font-weight:600;font-size:15px}
.form .inp{width:100%}
.form-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sum div{background:var(--sunk);border-radius:14px;padding:10px 12px;display:grid}
.sum small{font-size:12.5px;color:var(--muted);font-weight:600}
.sum b{font-family:var(--display);font-weight:800;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.pr{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--goodbg);font-weight:600;font-size:15px}
textarea.inp{height:120px;padding:10px 12px;font-family:ui-monospace,Menlo,monospace;font-size:12.5px;resize:vertical}
.rir{display:flex;align-items:center;gap:4px}
.rir i{width:16px;height:26px;border-radius:5px;background:var(--ink)}
.rir i.o{background:transparent;box-shadow:inset 0 0 0 2px var(--muted)}
.rir em{font-style:normal;font-weight:700;font-size:14px;margin-left:8px}

/* timer */
.timer{position:fixed;inset:0;z-index:70;background:var(--bg);overflow:auto;padding-top:calc(14px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));--ph:var(--pC)}
.timer[data-phase="work"]{--ph:var(--pA)}
.timer[data-phase="rest"]{--ph:var(--pD)}
.timer[data-phase="swap"]{--ph:var(--pC)}
.timer[data-phase="long"]{--ph:var(--pB)}
.timer[data-phase="done"]{--ph:var(--good)}
.tm-in{max-width:520px;margin-inline:auto;display:grid;gap:14px;justify-items:center;text-align:center}
.tm-top{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left}
.tm-ring{position:relative;width:min(80vw,340px);aspect-ratio:1;max-width:100%}
.tm-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.tr-bg{fill:none;stroke:var(--line);stroke-width:6}
.tr-fg{fill:none;stroke:var(--ph);stroke-width:6;stroke-linecap:round}
.tm-center{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:2px}
.tm-phase{font-family:var(--display);font-weight:800;font-style:italic;font-size:30px;text-transform:uppercase;color:var(--ph);line-height:1}
.tm-time{font-family:var(--display);font-weight:800;font-size:clamp(76px,24vw,118px);line-height:1;font-variant-numeric:tabular-nums}
.tm-round{font-size:14px;color:var(--muted)}
.tm-label{font-family:var(--display);font-weight:800;font-size:28px;text-transform:uppercase;line-height:1}
.tm-next{font-size:15px;color:var(--muted);min-height:1.5em}
.tm-ctl{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.tm-ctl .primary{min-width:160px}

/* toast */
body.wo-open .toast{bottom:calc(150px + env(safe-area-inset-bottom,0px))}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:80;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:15px;max-width:calc(100% - 32px);text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.18)}

/* figures */
.fig .limb{fill:none;stroke:var(--fig);stroke-width:7.5;stroke-linecap:round;stroke-linejoin:round}
.fig .far .limb{stroke:var(--fig-far)}
.fig .torso{stroke:var(--fig);stroke-width:11.5;stroke-linecap:round}
.fig .head{fill:var(--fig)}
.fig .gnd{stroke:var(--ground);stroke-width:2;stroke-dasharray:1 6;stroke-linecap:round}
.fig .plate{fill:var(--tone);stroke:var(--surface);stroke-width:1.5}
.fig .hub{fill:var(--surface)}
.fig .iron{fill:var(--iron)}
.fig .kbh{fill:none;stroke:var(--iron);stroke-width:2.4}
.fig .ball{fill:var(--tone)}
.fig .seam{fill:none;stroke:var(--surface);stroke-width:1.3;opacity:.8}
.fig .cable{stroke:var(--muted);stroke-width:1.4}
.fig .rope{fill:none;stroke:var(--tone);stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
.fig .rope.f{stroke:var(--fig-far)}
.fig .ropeh{stroke:var(--tone);stroke-width:3;stroke-linecap:round}
.fig .crank{stroke:var(--iron);stroke-width:3.4;stroke-linecap:round}
.fig .crank.f{stroke:var(--scene)}
.fig .sc{fill:var(--scene)}
.fig .scl{fill:none;stroke:var(--scene);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.fig .scl3{fill:none;stroke:var(--scene);stroke-width:3;stroke-linecap:round}
.fig .pad{fill:none;stroke:var(--scene);stroke-width:9;stroke-linecap:round}
.fig .pulse{fill:var(--tone);opacity:.2}
@media (prefers-reduced-motion: reduce){.panel{animation:none}.switch::after{transition:none}}
</style>
</head>

<script>
'use strict';
/* ================= rig ================= */
const NS='http://www.w3.org/2000/svg';
const RM=typeof matchMedia!=='undefined'&&matchMedia('(prefers-reduced-motion: reduce)').matches;
const L={torso:48,neck:15,up:27,fo:25,th:37,sh:36,foot:11};
const rad=a=>a*Math.PI/180;
const dir=a=>[Math.sin(rad(a)),-Math.cos(rad(a))];
const add=(p,a,l)=>{const d=dir(a);return[p[0]+d[0]*l,p[1]+d[1]*l]};
const FO=[2.5,-1.5];
const off=p=>[p[0]+FO[0],p[1]+FO[1]];
function ik(A,T,l1,l2,s){
  const dx=T[0]-A[0],dy=T[1]-A[1];const d=Math.hypot(dx,dy)||0.001;
  const mx=l1+l2-0.05,mn=Math.abs(l1-l2)+0.05;const dc=Math.min(mx,Math.max(mn,d));
  const phi=Math.atan2(dy,dx);
  const c=(l1*l1+dc*dc-l2*l2)/(2*l1*dc);const a=Math.acos(Math.max(-1,Math.min(1,c)));
  const ang=phi+s*a;
  return[[A[0]+Math.cos(ang)*l1,A[1]+Math.sin(ang)*l1],[A[0]+Math.cos(phi)*dc,A[1]+Math.sin(phi)*dc]];
}
function solve(p){
  const hip=p.hip,t=p.t||0;
  const sh=add(hip,t,L.torso);
  const head=add(sh,t+(p.h||0),L.neck);
  const g=p.grip||'free';const upl=L.up*(p.uk==null?1:p.uk);
  let eN,hN,eF,hF;
  if(g==='fk'){
    eN=add(sh,p.ua,upl);hN=add(eN,p.fa2,L.fo);eF=eN;hF=hN;
  }else{
    let tn,tf;
    if(g==='hang'){tn=[sh[0]+(p.hx||0),sh[1]+51];tf=tn;}
    else if(g==='arc'){tn=add(sh,p.aa,51.6);tf=p.aaf==null?tn:add(sh,p.aaf,51.6);}
    else if(g==='back'){tn=add(add(sh,t-90,5),t+180,3);tf=tn;}
    else if(g==='chest'){tn=add(add(sh,t+90,12),t+180,11);tf=tn;}
    else if(g==='hipbar'){tn=add(hip,t+90,9);tf=tn;}
    else{tn=p.hn;tf=p.hf||p.hn;}
    const en=p.en==null?1:p.en;
    [eN,hN]=ik(sh,tn,upl,L.fo,en);[eF,hF]=ik(sh,tf,upl,L.fo,en);
  }
  const kn=p.kn==null?-1:p.kn;
  const[kN,aN]=ik(hip,p.fn,L.th,L.sh,kn);
  const[kF,aF]=ik(hip,p.ff||p.fn,L.th,L.sh,kn);
  const fa=p.fa==null?22:p.fa,faf=p.faf==null?fa:p.faf;
  const toe=(a,ang)=>[a[0]+Math.cos(rad(ang))*L.foot,a[1]+Math.sin(rad(ang))*L.foot];
  return{hip,sh,head,eN,hN,eF,hF,kN,aN,kF,aF,tN:toe(aN,fa),tF:toe(aF,faf),t};
}
function lerpV(a,b,u){
  if(typeof a==='number'&&typeof b==='number')return a+(b-a)*u;
  if(Array.isArray(a)&&Array.isArray(b))return a.map((v,i)=>v+(b[i]-v)*u);
  return u<.5?a:b;
}
function lerpPose(a,b,u){const o={};for(const k in a)o[k]=(k in b)?lerpV(a[k],b[k],u):a[k];for(const k in b)if(!(k in a))o[k]=b[k];return o;}
function timeline(frames){
  const total=frames.reduce((s,f)=>s+f[1],0);
  return{total,frames,at(time){
    let tt=((time%total)+total)%total;
    for(let i=0;i<frames.length;i++){
      const d=frames[i][1];
      if(tt<=d||i===frames.length-1){
        const u=d>0?Math.min(1,tt/d):1;const e=(1-Math.cos(Math.PI*u))/2;
        return lerpPose(frames[i][0],frames[(i+1)%frames.length][0],e);
      }
      tt-=d;
    }
  }};
}
function plank(beta,ax,ay){const u=[Math.cos(rad(beta)),-Math.sin(rad(beta))];return{hip:[ax+u[0]*72.6,ay+u[1]*72.6],t:90-beta,fn:[ax,ay]};}

/* ================= props ================= */
function bar(D,c,r){D.b.c(c[0],c[1],r,'plate');D.b.c(c[0],c[1],r*.3,'hub');D.f.c(c[0],c[1],2.8,'iron');}
function dbs(D,r,s){s=s||6.5;const f=off(r.hF);D.b.c(f[0],f[1],s,'iron');D.b.c(f[0],f[1],s*.32,'hub');D.f.c(r.hN[0],r.hN[1],s,'iron');D.f.c(r.hN[0],r.hN[1],s*.32,'hub');}
function kb(D,h,e){const dx=h[0]-e[0],dy=h[1]-e[1],l=Math.hypot(dx,dy)||1;D.f.c(h[0],h[1],3.8,'kbh');D.f.c(h[0]+dx/l*10.5,h[1]+dy/l*10.5,8.4,'iron');}
function ball(D,c,r){D.f.c(c[0],c[1],r,'ball');D.f.p('M'+(c[0]-r).toFixed(1)+' '+c[1].toFixed(1)+'Q'+c[0].toFixed(1)+' '+(c[1]+r*.55).toFixed(1)+' '+(c[0]+r).toFixed(1)+' '+c[1].toFixed(1),'seam');}
function cable(D,a,b){D.b.l(a[0],a[1],b[0],b[1],'cable');}

/* ================= exercises ================= */
const EX={};
EX.squat={name:'Agachamento livre',muscles:['Quadríceps','Glúteos','Core'],
  steps:['Apoie a barra no trapézio, pés na largura dos ombros e pontas levemente para fora.','Respire fundo, trave o abdômen e desça levando o quadril para trás e os joelhos para fora.','Desça até a coxa ficar paralela ao chão, ou até onde a lombar continuar neutra.','Suba empurrando o chão com o pé inteiro e solte o ar no final.'],
  errors:['Calcanhar saindo do chão','Joelhos caindo para dentro','Lombar arredondando no fundo'],
  tip:'Faça dentro do rack com os pinos de segurança na altura certa.',
  base:{fn:[104,174],grip:'back',en:-1},
  frames:[[{hip:[101,102],t:3,h:-3},.45],[{hip:[101,102],t:3,h:-3},1.25],[{hip:[84,138],t:40,h:-28},.2],[{hip:[84,138],t:40,h:-28},1.0]],
  props(D,r){bar(D,r.hN,15);}};
EX.airsquat={name:'Agachamento livre sem peso',muscles:['Quadríceps','Glúteos'],
  steps:['Pés na largura dos ombros, braços soltos.','Desça levando o quadril para trás e estique os braços à frente para equilibrar.','Vá até onde mantiver o calcanhar no chão e a lombar neutra.','Suba devagar e controlado.'],
  errors:['Pressa: aqui é aquecimento','Calcanhar saindo do chão'],
  base:{fn:[104,174],grip:'arc'},
  frames:[[{hip:[101,102],t:2,h:0,aa:178},.35],[{hip:[101,102],t:2,h:0,aa:178},1.1],[{hip:[86,138],t:34,h:-22,aa:92},.2],[{hip:[86,138],t:34,h:-22,aa:92},.9]]};
EX.goblet={name:'Agachamento goblet',muscles:['Quadríceps','Glúteos','Core'],
  steps:['Segure um halter ou kettlebell colado ao peito, cotovelos para baixo.','Pés um pouco mais abertos que os ombros.','Desça entre as pernas com o peito aberto; os cotovelos passam por dentro dos joelhos.','Suba forte mantendo o peso colado ao corpo.'],
  errors:['Peso se afastando do peito','Tronco desabando para frente','Joelhos para dentro'],
  base:{fn:[104,174],grip:'chest'},
  frames:[[{hip:[101,102],t:2,h:0},.35],[{hip:[101,102],t:2,h:0},1.1],[{hip:[86,140],t:22,h:-10},.2],[{hip:[86,140],t:22,h:-10},.9]],
  props(D,r){const h=r.hN;D.f.r(h[0]-2.5,h[1]-9,10,16,3,'iron');}};
EX.deadlift={name:'Levantamento terra',muscles:['Posterior de coxa','Glúteos','Lombar','Costas'],thumb:0,
  steps:['Barra sobre o meio do pé, canela a dois ou três dedos dela.','Pegue a barra com os braços esticados, peito para cima e costas retas.','Empurre o chão com as pernas; a barra sobe raspando nas pernas.','Termine em pé contraindo o glúteo e desça pelo mesmo caminho.'],
  errors:['Costas arredondadas','Barra longe do corpo','Jogar o tronco para trás no topo'],
  base:{fn:[101,174],grip:'hang'},
  frames:[[{hip:[66.5,133.3],t:65,h:-30},.3],[{hip:[66.5,133.3],t:65,h:-30},1.1],[{hip:[100,102],t:-1,h:0},.45],[{hip:[100,102],t:-1,h:0},1.3]],
  props(D,r){bar(D,r.hN,15);}};
EX.bench={name:'Supino reto com barra',muscles:['Peitoral','Tríceps','Ombro'],
  steps:['Deite com os olhos sob a barra, escápulas juntas e pés firmes no chão.','Pegada um pouco mais aberta que os ombros.','Desça até a parte baixa do peito com os cotovelos a uns 45° do corpo.','Empurre de volta até esticar os braços sobre os ombros.'],
  errors:['Quicar a barra no peito','Cotovelos abertos a 90°','Tirar o quadril do banco'],
  tip:'Use os pinos de segurança do rack ou peça para alguém observar.',
  scene:'<rect class="sc" x="36" y="134" width="104" height="7" rx="3"/><path class="scl3" d="M48 141V180M128 141V180M152 64V180M146 76h8"/>',
  base:{hip:[66,128],t:90,h:-8,fn:[40,174],kn:1,fa:158,grip:'free',en:-1},
  frames:[[{hn:[113,76]},.35],[{hn:[113,76]},1.2],[{hn:[107,116]},.15],[{hn:[107,116]},.85]],
  props(D,r){bar(D,r.hN,15);}};
EX.incline={name:'Supino inclinado com halteres',muscles:['Peitoral superior','Ombro','Tríceps'],

let CHART='kg';
function chartSvg(series,goal,unit){
  if(series.length<2)return'<p class="empty">Registre pelo menos duas medidas para ver o gráfico.</p>';
  const W=340,H=190,pl=34,pr=14,pt=22,pb=24;
  const xs=series.map(p=>p.t),x0=Math.min(...xs),x1=Math.max(...xs);
  let vals=series.map(p=>p.v);if(goal!=null)vals=vals.concat([goal]);
  let lo=Math.min(...vals),hi=Math.max(...vals);const span=Math.max(2,hi-lo);
  const step=span<=4?1:span<=10?2:span<=25?5:10;lo=Math.floor((lo-.3)/step)*step;hi=Math.ceil((hi+.3)/step)*step;
  const X=t=>pl+12+(x1===x0?.5:(t-x0)/(x1-x0))*(W-pl-pr-18),Y=v=>pt+(hi-v)/(hi-lo)*(H-pt-pb);
  let s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Gráfico de '+(unit==='kg'?'peso':'cintura')+'">';
  for(let v=lo;v<=hi+1e-9;v+=step){s+='<line class="gl" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+Y(v).toFixed(1)+'" y2="'+Y(v).toFixed(1)+'"/><text class="gt" x="'+(pl-6)+'" y="'+(Y(v)+4).toFixed(1)+'" text-anchor="end">'+fmtN(v)+'</text>';}
  if(goal!=null){s+='<line class="goal-l" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+Y(goal).toFixed(1)+'" y2="'+Y(goal).toFixed(1)+'"/><text class="goal-t" x="'+(W-pr)+'" y="'+(Y(goal)-5).toFixed(1)+'" text-anchor="end">meta '+fmtN(goal)+'</text>';}
  const P=series.map(p=>[X(p.t),Y(p.v)]);
  s+='<path class="ar" d="M'+P[0][0].toFixed(1)+' '+(H-pb)+P.map(p=>'L'+p[0].toFixed(1)+' '+p[1].toFixed(1)).join('')+'L'+P[P.length-1][0].toFixed(1)+' '+(H-pb)+'Z"/>';
  s+='<path class="ln" d="'+P.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join('')+'"/>';
  P.forEach((p,i)=>{s+='<circle class="pt'+(i===P.length-1?' end':'')+'" cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="'+(i===P.length-1?4.5:3.2)+'"/>';});
  const e=P[P.length-1];s+='<text class="vt" x="'+Math.min(W-pr,e[0]).toFixed(1)+'" y="'+(e[1]-10).toFixed(1)+'" text-anchor="end">'+fmtN(series[series.length-1].v)+' '+unit+'</text>';
  s+='<text class="gt" x="'+pl+'" y="'+(H-6)+'">'+fmtD(new Date(x0))+'</text><text class="gt" x="'+(W-pr)+'" y="'+(H-6)+'" text-anchor="end">'+fmtD(new Date(x1))+'</text>';
  return s+'</svg>';
}

  // measures
  if(DB.measures.length){
    h+='<h2 class="sec-title">Medidas</h2><section class="card"><ul class="list">'+DB.measures.slice().reverse().map(x=>'<li><div class="li"><span class="grow"><b>'+fmtWD(x.date)+'</b><span>'+(x.kg!=null?fmtN(x.kg)+' kg':'')+(x.kg!=null&&x.waist!=null?' · ':'')+(x.waist!=null?'cintura '+fmtN(x.waist)+' cm':'')+'</span></span><button class="del" data-act="del-measure" data-date="'+x.date+'" aria-label="Apagar medida de '+fmtD(x.date)+'">'+ico('x')+'</button></div></li>').join('')+'</ul></section>';

function finishWorkout(){

  const lifts=flatLifts(template(D.wo,D.w));const log={};let sets=0,planned=0,vol=0;
  lifts.forEach(it=>{const rows=D.sets[it.id]||[];planned+=rows.length;const dn=rows.filter(r=>r.done);if(!dn.length)return;const lt=logOf(it.ex);

  if(prs.length)h+=prs.map(p=>'<div class="pr">'+ico('trophy')+'<span>Recorde: '+EX[p.ex].name+', '+fmtN(p.kg)+' kg</span></div>').join('');

let discardArm=0;

/* ================= interval timer ================= */
const TM={seq:[],i:0,left:0,run:false,last:0,raf:0,beepAt:-1,item:null};
const CIRC=289.03;
function seqInt(it){const o=[{k:'prep',s:5,l:'Primeiro: '+EX[it.ex].name}];for(let i=0;i<it.rounds;i++){o.push({k:'work',s:it.work,l:EX[it.ex].name,r:'Tiro '+(i+1)+' de '+it.rounds});if(i<it.rounds-1)o.push({k:'rest',s:it.rest,l:'Leve',r:'Tiro '+(i+1)+' de '+it.rounds});}return o;}
function seqCirc(it){const o=[{k:'prep',s:5,l:'Primeiro: '+EX[it.stations[0]].name}],n=it.rounds,st=it.stations;
  for(let r=0;r<n;r++)st.forEach((id,i)=>{o.push({k:'work',s:it.work,l:EX[id].name,r:'Volta '+(r+1)+' de '+n+' · estação '+(i+1)+' de '+st.length});
    if(i<st.length-1)o.push({k:'swap',s:it.rest,l:'Troca: '+EX[st[i+1]].name,r:'Volta '+(r+1)+' de '+n});
    else if(r<n-1)o.push({k:'long',s:it.between,l:'Descanso entre voltas',r:'Volta '+(r+1)+' concluída'});});
  return o;}
function openTimer(it){
  TM.item=it;TM.seq=it.t==='circ'?seqCirc(it):seqInt(it);TM.i=0;TM.left=TM.seq[0].s;TM.beepAt=-1;tmStop();
  $('#tmTitle').textContent=it.t==='circ'?'Circuito':'Finalizador · '+EX[it.ex].name;
  $('#timer').hidden=false;tmRender();$('#tmPlay').focus();
}
function closeTimer(){tmStop();$('#timer').hidden=true;}
function tmRender(){
  const done=TM.i>=TM.seq.length,cur=done?null:TM.seq[TM.i];
  $('#timer').dataset.phase=done?'done':cur.k;
  $('#tmPhase').textContent=done?'Feito':({prep:'Prepare-se',work:'Forte',rest:'Leve',swap:'Troca',long:'Descanso'})[cur.k];
  $('#tmLabel').textContent=done?'Mandou bem.':cur.l;
  $('#tmTime').textContent=done?'0:00':mmss(TM.left);
  $('#tmArc').setAttribute('stroke-dashoffset',done?'0':(CIRC*(1-Math.max(0,TM.left)/cur.s)).toFixed(1));
  const nx=done?null:TM.seq.slice(TM.i+1).find(x=>x.k!=='prep');
  $('#tmNext').textContent=nx?'Depois: '+nx.l+' · '+nx.s+' s':'';
  $('#tmRound').textContent=cur&&cur.r?cur.r:'';
  const started=TM.i>0||(cur&&TM.left<cur.s);
  $('#tmPlay').textContent=TM.run?'Pausar':done?'Fechar':started?'Continuar':'Iniciar';
  const rest=done?0:TM.seq.slice(TM.i+1).reduce((a,x)=>a+x.s,0)+Math.max(0,TM.left);
  $('#tmTotal').textContent=done?'':'Tempo restante '+mmss(rest);
}
function tmTick(now){
  if(!TM.run)return;TM.left-=(now-TM.last)/1000;TM.last=now;
  const s=Math.ceil(TM.left);if(s<=3&&s>=1&&s!==TM.beepAt){TM.beepAt=s;beep(660,.08);}
  while(TM.left<=0){TM.i++;TM.beepAt=-1;
    if(TM.i>=TM.seq.length){TM.run=false;beep(880,.6);tmRender();tmDone();return;}
    TM.left+=TM.seq[TM.i].s;beep(TM.seq[TM.i].k==='work'?990:520,.28);}
  tmRender();TM.raf=requestAnimationFrame(tmTick);
}
function tmDone(){const D=DB.draft;if(D&&TM.item){D.flags[TM.item.id]=true;save();renderWorkoutKeepScroll();}}
function tmPlay(){
  if(TM.i>=TM.seq.length){closeTimer();return;}
  audio();TM.run=true;TM.last=performance.now();cancelAnimationFrame(TM.raf);TM.raf=requestAnimationFrame(tmTick);tmRender();
}
function tmStop(){TM.run=false;cancelAnimationFrame(TM.raf);}
function renderWorkoutKeepScroll(){const y=woEl.scrollTop;renderWorkout();woEl.scrollTop=y;tickWo();}

    case'wo-min':minimizeWorkout();break;
    case'set':if(D)toggleSet(t.dataset.item,+t.dataset.i);break;
    case'sug':if(D){const inc=+t.dataset.inc,id=t.dataset.item;D.sets[id].forEach(r=>{if(!r.done){const k=num(r.kg);if(k!=null)r.kg=String(Math.round((k+inc)*100)/100).replace('.',',');}});D.applied[id]=1;save();refreshLift(id);toast('Carga ajustada: +'+fmtN(inc)+' kg');}break;

    case'wo-finish':if(D){const any=Object.values(D.sets).some(rows=>rows.some(r=>r.done))||Object.values(D.flags).some(Boolean);if(!any){toast('Marque pelo menos uma série antes de concluir.');break;}finishWorkout();}break;

    case'tm-reset':tmStop();TM.i=0;TM.left=TM.seq[0].s;TM.beepAt=-1;tmRender();break;
    case'tm-close':closeTimer();break;
    case'backup-copy':{const txt=backupText();const fallback=()=>openSheet('<h2>Backup</h2><p class="sub">Selecione o texto abaixo, copie e guarde nas Notas ou mande para você mesmo.</p><textarea class="inp" id="bkTxt" readonly>'+esc(txt)+'</textarea>',null,'Backup');
      try{navigator.clipboard.writeText(txt).then(()=>toast('Backup copiado. Cole nas Notas para guardar.'),()=>{fallback();const ta=$('#bkTxt');if(ta)ta.select();});}catch(err){fallback();}break;}
    case'backup-file':try{const blob=new Blob([backupText()],{type:'application/json'}),u=URL.createObjectURL(blob),el=document.createElement('a');el.href=u;el.download='rumo90-backup-'+todayStr()+'.json';document.body.appendChild(el);el.click();el.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);toast('Arquivo de backup gerado.');}catch(err){toast('Não deu para salvar o arquivo aqui. Use Copiar backup.');}break;
    case'restore':openSheet('<h2>Restaurar backup</h2><p class="sub">Escolha o arquivo de backup ou cole o texto copiado. Os dados atuais deste aparelho serão substituídos.</p><label class="btn block" for="rsFile" style="cursor:pointer">Escolher arquivo</label><input type="file" id="rsFile" accept=".json,application/json,text/plain" hidden><textarea class="inp" id="rsTxt" placeholder="Ou cole o texto do backup aqui"></textarea><p class="small" id="rsErr" style="color:var(--hot)" hidden></p><button class="btn primary block" data-act="restore-go">Restaurar</button>',null,'Restaurar backup');break;
    case'restore-go':{const err=restoreFrom(($('#rsTxt')||{}).value||'');if(err){const p=$('#rsErr');p.textContent=err;p.hidden=false;}else{closeSheet();render();toast('Backup restaurado.');}break;}
    case'wipe':if(Date.now()-wipeArm<4000){DB=fresh();save();render();toast('Dados apagados.');}else{wipeArm=Date.now();t.textContent='Toque de novo para apagar tudo';setTimeout(()=>{if(t.isConnected)t.textContent='Apagar todos os dados';},4000);}break;
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.matches('.cell')&&DB.draft){const r=DB.draft.sets[t.dataset.item]&&DB.draft.sets[t.dataset.item][+t.dataset.i];if(r){r[t.dataset.f]=t.value.trim();saveSoon();}}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='setStart'&&t.value){DB.start=t.value;save();toast('Início do plano atualizado.');}
  if(t.id==='setStartKg'){const v=num(t.value);if(v){DB.startKg=v;save();}}
  if(t.id==='setGoal'){const v=num(t.value);if(v){DB.goalKg=v;save();}}
  if(t.id==='rsFile'&&t.files&&t.files[0]){const fr=new FileReader();fr.onload=()=>{const err=restoreFrom(String(fr.result||''));if(err){const p=$('#rsErr');p.textContent=err;p.hidden=false;}else{closeSheet();render();toast('Backup restaurado.');}};fr.readAsText(t.files[0]);}
});
document.addEventListener('submit',e=>{
  if(e.target.id!=='mForm')return;e.preventDefault();
  const date=$('#mDate').value||todayStr(),kg=num($('#mKg').value),waist=num($('#mWaist').value),err=$('#mErr');
  if(kg==null&&waist==null){err.textContent='Preencha o peso, a cintura ou os dois.';err.hidden=false;return;}
  if(kg!=null&&(kg<30||kg>300)){err.textContent='Confira o peso: use quilos, como 98,5.';err.hidden=false;return;}
  if(waist!=null&&(waist<40||waist>250)){err.textContent='Confira a cintura: use centímetros, como 104.';err.hidden=false;return;}
  const ex=DB.measures.find(x=>x.date===date);
  if(ex){if(kg!=null)ex.kg=kg;if(waist!=null)ex.waist=waist;}else DB.measures.push({date,kg,waist});
  DB.measures.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
  save();closeSheet();render();toast('Medida salva.');
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('#timer').hidden)closeTimer();else closeSheet();}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){if(!woEl.hidden){wake(true);tickWo();}else render();}});
window.addEventListener('hashchange',route);

/* ================= init ================= */
route();
if(DB.draft&&Date.now()-(DB.draft.started||0)<3*3600*1000)openWorkout();
})();
</script>

<script>
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
</script>
